project:
  name: HEAL-CITY
  city: Surabaya
  baseline_year: 2024

data:
  raw_excel: dataset/data smart city.xlsx
  cleaned_dir: data/cleaned
  processed_dir: data/processed
  spatial_dir: data/spatial
  master: data/processed/master_heal_city.csv
  features: data/processed/heal_city_features.csv
  gap: data/processed/healthcare_gap_scores.csv
  root_cause: data/processed/root_cause_analysis.csv

spatial:
  district: data/spatial/kecamatan_surabaya.geojson
  puskesmas: data/spatial/puskesmas.geojson
  facilities: data/spatial/fasilitas_kesehatan.geojson
  roads: data/spatial/roads.geojson
  geojson_output: dataset/spatial/output/heal_city_gap.geojson

output:
  tables: outputs/tables
  figures: outputs/figures
  gis: outputs/gis
  reports: outputs/reports

model:
  random_state: 42

gap_engine:
  demand:
    population_weight: 0.50
    service_weight: 0.50
    disease_weight: 0.00

  workforce:
    doctors_weight: 0.40
    nurses_weight: 0.40
    midwives_weight: 0.20

  facility:
    facilities_weight: 0.30
    puskesmas_weight: 0.25
    pustu_weight: 0.15
    beds_weight: 0.30

  composite:
    demand_weight: 0.30
    workforce_weight: 0.30
    facility_weight: 0.20
    disease_weight: 0.20

root_cause:
  high_threshold: 0.80
  medium_threshold: 0.60
  threshold_high: 0.80
  threshold_medium: 0.60

simulation:
  max_budget: 5000000000

optimizer:
  max_iterations: 10000
